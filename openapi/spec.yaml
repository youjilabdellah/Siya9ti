openapi: 3.0.3
info:
  title: Driving Instructor Booking API
  description: API to find driving instructors by city, check availability, pricing, and book lessons online.
  version: 1.0.0

servers:
  - url: https://api.mockdriving.com/v1

paths:
  /cities:
    get:
      summary: Get available cities
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        example: Rabat
                      value:
                        type: string
                        example: '1'
              example:
                - label: Rabat
                  value: '1'
                - label: Casablanca
                  value: '2'
                - label: Marrakech
                  value: '3'

  /instructors:
    get:
      summary: Get instructors by city
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of instructors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructors'

  /instructors/{id}/availability:
    get:
      summary: Get instructor availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'

  /instructors/{id}/pricing:
    get:
      summary: Get instructor pricing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pricing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'

  /bookings:
    post:
      summary: Book a driving lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

components:
  schemas:
    Instructors:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          name:
            type: string
          city:
            type: string
          vehicleType:
            type: string
            enum: [manual, automatic]
          rating:
            type: number
            format: float
          currency:
            type: string
          pricePerHour:
            type: number
          packages:
            type: array
            items:
              type: object
              properties:
                hours:
                  type: integer
                price:
                  type: number
      example:
        - id: inst_101
          name: Ahmed Benali
          city: Rabat
          vehicleType: manual
          rating: 4.7
          currency: MAD
          pricePerHour: 150
          packages:
            - hours: 10
              price: 1400
            - hours: 20
              price: 2600
        - id: inst_102
          name: Fatima Essaoui
          city: Casablanca
          vehicleType: automatic
          rating: 4.8
          currency: MAD
          pricePerHour: 160
          packages:
            - hours: 5
              price: 750
            - hours: 15
              price: 2200
        - id: inst_103
          name: Mohammed Hassan
          city: Marrakech
          vehicleType: manual
          rating: 4.5
          currency: MAD
          pricePerHour: 120
          packages:
            - hours: 10
              price: 1100
            - hours: 20
              price: 2000
        - id: inst_104
          name: Noor El Moussawy
          city: Fez
          vehicleType: automatic
          rating: 4.9
          currency: MAD
          pricePerHour: 180
          packages:
            - hours: 10
              price: 1700
            - hours: 25
              price: 4000

    Availability:
      type: object
      properties:
        instructorId:
          type: string
        slots:
          type: array
          items:
            type: object
            properties:
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              isAvailable:
                type: boolean

    Pricing:
      type: object
      properties:
        instructorId:
          type: string
        currency:
          type: string
          example: MAD
        pricePerHour:
          type: number
          example: 150
        packages:
          type: array
          items:
            type: object
            properties:
              hours:
                type: integer
                example: 10
              price:
                type: number
                example: 1400

    BookingRequest:
      type: object
      required:
        - instructorId
        - startTime
        - endTime
        - user
      properties:
        instructorId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string

    Booking:
      type: object
      properties:
        id:
          type: string
          example: book_456
        instructorId:
          type: string
        status:
          type: string
          enum: [confirmed, pending, cancelled]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalPrice:
          type: number
          example: 150