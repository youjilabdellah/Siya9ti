name: React Native Build

on:
  push:
    branches:
      - main
      - staging
  pull_request:

jobs:
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle
          key: ${{ runner.os }}-npm-gradle-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-npm-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build Android release
        working-directory: android
        run: ./gradlew assembleRelease

  ios-build:
    name: Build iOS
    runs-on: macos-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install node dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS app
        working-directory: ios
        run: xcodebuild -workspace Siya9ti.xcworkspace -scheme Siya9ti -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
